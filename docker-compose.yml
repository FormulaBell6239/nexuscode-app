services:
  postgres:
    image: postgres:16-alpine
    container_name: nexuscode-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nexuscode
    ports:
      - "5432:5432"
    volumes:
      - nexuscode-pgdata:/var/lib/postgresql/data

volumes:
  nexuscode-pgdata:
